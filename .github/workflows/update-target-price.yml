name: 更新外資目標價

on:
  schedule:
    # 每日輪詢部分股票；約十天完整輪過一次全市場。
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockepsv1-data-writer
  cancel-in-progress: false

jobs:
  target-price:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install requests

      - name: 輪詢公開外資評等目標價
        env:
          TARGET_PRICE_MAX_STOCKS: '240'
          TARGET_PRICE_WORKERS: '1'
          TARGET_PRICE_REQUEST_DELAY: '1.0'
          TARGET_PRICE_HISTORY_DAYS: '365'
        run: python update_target_price.py

      - name: 驗證資料結構與涵蓋率
        run: |
          python -m unittest discover -s tests -v
          python validate_data.py

      - name: commit 更新後的 JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add finmind_data.json
          git commit -m "auto: update foreign target prices $(date +%F)" || { echo "無變化"; exit 0; }
          git pull --rebase --autostash origin main
          git push
