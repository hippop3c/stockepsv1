name: 更新股價 OHLC

on:
  schedule:
    # 每個交易日台灣時間 20:17 與 22:17 重試；避開交易所 18:00 尚未同步完成的情況。
    - cron: '17 12,14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockepsv1-data-writer
  cancel-in-progress: false

jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install requests

      - name: 抓全市場開高低收
        env:
          PRICE_HISTORY_DAYS: '30'
        run: python update_price.py

      - name: 驗證資料結構與涵蓋率
        run: |
          python -m unittest discover -s tests -v
          python validate_data.py

      - name: commit 更新後的 JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add finmind_data.json
          git commit -m "auto: update ohlc $(date +%F)" || { echo "無變化"; exit 0; }
          git pull --rebase --autostash origin main
          git push
